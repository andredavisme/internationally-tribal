<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internationally Tribal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    svg {
      width: min(90vw, 90vh);
      height: min(90vw, 90vh);
    }
  </style>
</head>
<body>

<svg id="logo" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

  <!-- Outer black circle -->
  <circle cx="250" cy="250" r="248" fill="black" />

  <!-- White octagon border ring -->
  <polygon id="octagon" points="155,15 345,15 485,155 485,345 345,485 155,485 15,345 15,155"
    fill="none" stroke="white" stroke-width="14" />

  <!-- Inner black circle -->
  <circle cx="250" cy="250" r="210" fill="black" />

  <!-- White tilted square background -->
  <rect id="square" x="95" y="110" width="310" height="285" rx="4"
    fill="white" transform="rotate(-4, 250, 250)" />

  <!-- RED SHAPE: I — pointed top and bottom, spaced left -->
  <!-- 6-point shape: pointed tip top, wide middle, pointed tip bottom -->
  <polygon id="blade-i"
    points="172,128 188,145 188,365 172,382 156,365 156,145"
    fill="red" />

  <!-- RED SHAPE: T crossbar — pointed left and right tips -->
  <polygon id="crossbar-t"
    points="210,128 388,128 400,152 388,175 210,175 198,152"
    fill="red" />

  <!-- RED SHAPE: T stem — pointed bottom tip, parallel sides -->
  <polygon id="stem-t"
    points="285,175 325,175 325,365 305,385 285,365"
    fill="red" />

  <!-- Pyramid triangle (universal symbol) -->
  <polygon id="pyramid"
    points="250,395 220,435 280,435"
    fill="none" stroke="white" stroke-width="4" />
  <line id="pyramid-inner" x1="250" y1="405" x2="250" y2="428" stroke="white" stroke-width="2" />
  <line id="pyramid-inner2" x1="235" y1="428" x2="265" y2="428" stroke="white" stroke-width="2" />

  <!-- Crossbones -->
  <g id="crossbones" stroke="white" stroke-width="4" stroke-linecap="round">
    <line x1="224" y1="450" x2="276" y2="468" />
    <line x1="276" y1="450" x2="224" y2="468" />
    <circle cx="220" cy="449" r="5" fill="white" />
    <circle cx="280" cy="449" r="5" fill="white" />
    <circle cx="220" cy="469" r="5" fill="white" />
    <circle cx="280" cy="469" r="5" fill="white" />
  </g>

  <!-- FACE ELEMENTS (hidden initially) -->
  <polygon id="eye-left"  points="195,210 195,210 195,210 195,210" fill="red" />
  <polygon id="eye-right" points="305,210 305,210 305,210 305,210" fill="red" />
  <polygon id="nose"      points="250,250 250,250 250,250"          fill="red" />
  <polyline id="mouth"
    points="200,340 200,340"
    fill="none" stroke="red" stroke-width="0" stroke-linejoin="miter" stroke-linecap="square" />

</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script>
window.addEventListener('load', () => {

  setTimeout(() => {

    const tl = anime.timeline({ easing: 'easeInOutQuart' });

    // I blade -> sharp angled left brow
    tl.add({
      targets: '#blade-i',
      points: [{ value: '155,165 230,155 238,188 163,198 155,182' }],
      duration: 800
    })

    // T crossbar -> sharp angled right brow
    .add({
      targets: '#crossbar-t',
      points: [{ value: '262,155 345,165 337,182 337,198 254,188' }],
      duration: 800
    }, '-=600')

    // T stem -> sharp narrow nose ridge
    .add({
      targets: '#stem-t',
      points: [{ value: '242,195 258,195 252,320 248,320 244,300' }],
      duration: 900
    }, '-=400')

    // Left eye diamond
    .add({
      targets: '#eye-left',
      points: [{ value: '163,215 195,205 227,215 195,225' }],
      duration: 600
    }, '-=300')

    // Right eye diamond
    .add({
      targets: '#eye-right',
      points: [{ value: '273,215 305,205 337,215 305,225' }],
      duration: 600
    }, '-=600')

    // Nose sharp triangle
    .add({
      targets: '#nose',
      points: [{ value: '242,265 258,265 252,318' }],
      duration: 500
    }, '-=200')

    // Mouth zigzag snarl
    .add({
      targets: '#mouth',
      strokeWidth: 7,
      points: [{ value: '195,332 215,320 233,338 252,322 270,338 288,320 305,332' }],
      duration: 700
    }, '-=200')

    // Pyramid chin spike
    .add({
      targets: '#pyramid',
      points: [{ value: '250,362 200,448 300,448' }],
      duration: 600
    }, '-=300')

    // HOLD on face
    .add({ targets: 'svg', opacity: 1, duration: 1400 })

    // ---- REVERSE ----

    .add({
      targets: '#pyramid',
      points: [{ value: '250,395 220,435 280,435' }],
      duration: 600
    })
    .add({
      targets: '#mouth',
      strokeWidth: 0,
      points: [{ value: '200,340 200,340 200,340 200,340 200,340 200,340 200,340' }],
      duration: 500
    }, '-=300')
    .add({
      targets: '#eye-left',
      points: [{ value: '195,210 195,210 195,210 195,210' }],
      duration: 500
    }, '-=200')
    .add({
      targets: '#eye-right',
      points: [{ value: '305,210 305,210 305,210 305,210' }],
      duration: 500
    }, '-=500')
    .add({
      targets: '#nose',
      points: [{ value: '250,250 250,250 250,250' }],
      duration: 400
    }, '-=200')
    .add({
      targets: '#stem-t',
      points: [{ value: '285,175 325,175 325,365 305,385 285,365' }],
      duration: 900
    }, '-=200')
    .add({
      targets: '#crossbar-t',
      points: [{ value: '210,128 388,128 400,152 388,175 210,175 198,152' }],
      duration: 800
    }, '-=500')
    .add({
      targets: '#blade-i',
      points: [{ value: '172,128 188,145 188,365 172,382 156,365 156,145' }],
      duration: 800
    }, '-=600');

  }, 2000);

});
</script>

</body>
</html>
