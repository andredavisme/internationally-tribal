<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter 03 — Invoice Generator</title>
  <style>
    :root {
      --black: #111;
      --red: #e00;
      --white: #f5f5f5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.5rem;
      border-bottom: 2px solid #1e1e1e;
      background: #111;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav a { color: var(--red); text-decoration: none; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
    nav span { color: #444; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: calc(100vh - 50px);
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .preview-pane { display: none; }
    }

    /* ── FORM PANE ── */
    .form-pane {
      padding: 2rem 2rem 4rem;
      border-right: 1px solid #1e1e1e;
      overflow-y: auto;
    }
    .pane-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--red);
      margin-bottom: 1.5rem;
    }
    .field-group {
      margin-bottom: 1.75rem;
    }
    .field-group-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
      border-bottom: 1px solid #1e1e1e;
      padding-bottom: 0.4rem;
      margin-bottom: 1rem;
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .field-row.full { grid-template-columns: 1fr; }
    label {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #555;
      margin-bottom: 0.3rem;
    }
    input, textarea, select {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: var(--white);
      font-family: inherit;
      font-size: 0.88rem;
      padding: 0.55rem 0.75rem;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--red); }
    input::placeholder, textarea::placeholder { color: #333; }
    textarea { resize: vertical; min-height: 60px; }

    /* ── LINE ITEMS ── */
    .line-items { margin-bottom: 1rem; }
    .line-item {
      display: grid;
      grid-template-columns: 1fr 70px 80px 28px;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .line-item input { margin: 0; }
    .line-delete {
      background: none;
      border: 1px solid #2a2a2a;
      color: #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      height: 34px;
      width: 28px;
      transition: border-color 0.2s, color 0.2s;
    }
    .line-delete:hover { border-color: var(--red); color: var(--red); }
    .line-header {
      display: grid;
      grid-template-columns: 1fr 70px 80px 28px;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .line-header span {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #444;
    }

    /* ── BUTTONS ── */
    .btn {
      background: transparent;
      border: 1px solid #333;
      color: #999;
      font-family: inherit;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0.55rem 1.25rem;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .btn:hover { border-color: var(--red); color: var(--white); }
    .btn.primary { border-color: var(--red); color: var(--red); }
    .btn.primary:hover { background: var(--red); color: white; }
    .btn-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    /* ── PREVIEW PANE ── */
    .preview-pane {
      background: #0d0d0d;
      padding: 2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #333;
      margin-bottom: 1.5rem;
      align-self: flex-start;
    }

    /* ── INVOICE SHEET ── */
    #invoice-sheet {
      background: white;
      color: #111;
      width: 100%;
      max-width: 640px;
      padding: 3rem 3rem 4rem;
      font-family: 'Segoe UI', Arial, sans-serif;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    .inv-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2.5rem;
      border-bottom: 3px solid #e00;
      padding-bottom: 1.5rem;
    }
    .inv-brand { font-size: 1.4rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.06em; }
    .inv-brand span { color: #e00; }
    .inv-meta { text-align: right; }
    .inv-meta .inv-number { font-size: 1rem; font-weight: bold; color: #111; }
    .inv-meta .inv-date { font-size: 0.8rem; color: #888; margin-top: 0.2rem; }
    .inv-parties {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }
    .inv-party-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #aaa;
      margin-bottom: 0.4rem;
    }
    .inv-party-name { font-weight: bold; font-size: 0.95rem; }
    .inv-party-detail { font-size: 0.82rem; color: #555; line-height: 1.6; white-space: pre-line; }
    .inv-table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
    .inv-table th {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #aaa;
      border-bottom: 1px solid #ddd;
      padding: 0.5rem 0.4rem;
      text-align: left;
    }
    .inv-table th:last-child, .inv-table td:last-child { text-align: right; }
    .inv-table td {
      padding: 0.65rem 0.4rem;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.88rem;
      color: #222;
    }
    .inv-totals {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
      margin-bottom: 2rem;
    }
    .inv-total-row {
      display: flex;
      gap: 2rem;
      font-size: 0.88rem;
      color: #555;
    }
    .inv-total-row.grand {
      font-size: 1.05rem;
      font-weight: bold;
      color: #111;
      border-top: 2px solid #e00;
      padding-top: 0.4rem;
      margin-top: 0.2rem;
    }
    .inv-total-row span:last-child { min-width: 90px; text-align: right; }
    .inv-notes {
      font-size: 0.82rem;
      color: #666;
      border-top: 1px solid #eee;
      padding-top: 1rem;
      white-space: pre-line;
    }
    .inv-notes-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #bbb;
      margin-bottom: 0.3rem;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 1.5rem; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e1e1e; border: 1px solid #333;
      border-left: 3px solid var(--red);
      color: #ccc; font-size: 0.82rem;
      padding: 0.55rem 1.2rem; border-radius: 4px;
      opacity: 0; transition: opacity 0.3s, transform 0.3s;
      pointer-events: none; white-space: nowrap; z-index: 9999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<nav>
  <a href="../../hub.html">&larr; All Chapters</a>
  <span>Ch 03 — Invoice Generator</span>
  <a href="activity.html">&#128218; Activity Guide</a>
</nav>

<div class="layout">

  <!-- FORM -->
  <div class="form-pane">
    <div class="pane-title">Build Your Invoice</div>

    <!-- SENDER -->
    <div class="field-group">
      <div class="field-group-title">From (You)</div>
      <div class="field-row full"><label>Name / Business</label><input id="from-name" placeholder="Internationally Tribal" oninput="render()" /></div>
      <div class="field-row full"><label>Email</label><input id="from-email" type="email" placeholder="hello@example.com" oninput="render()" /></div>
      <div class="field-row full"><label>Address / Details</label><textarea id="from-address" placeholder="Portland, ME 04101" oninput="render()"></textarea></div>
    </div>

    <!-- CLIENT -->
    <div class="field-group">
      <div class="field-group-title">Bill To (Client)</div>
      <div class="field-row full"><label>Client Name</label><input id="to-name" placeholder="Client Name" oninput="render()" /></div>
      <div class="field-row full"><label>Client Email</label><input id="to-email" type="email" placeholder="client@example.com" oninput="render()" /></div>
      <div class="field-row full"><label>Client Address</label><textarea id="to-address" placeholder="123 Main St" oninput="render()"></textarea></div>
    </div>

    <!-- INVOICE META -->
    <div class="field-group">
      <div class="field-group-title">Invoice Details</div>
      <div class="field-row">
        <div><label>Invoice #</label><input id="inv-number" placeholder="INV-001" oninput="render()" /></div>
        <div><label>Date</label><input id="inv-date" type="date" oninput="render()" /></div>
      </div>
      <div class="field-row">
        <div><label>Due Date</label><input id="inv-due" type="date" oninput="render()" /></div>
        <div><label>Currency</label>
          <select id="inv-currency" onchange="render()">
            <option value="$">USD ($)</option>
            <option value="£">GBP (£)</option>
            <option value="€">EUR (€)</option>
            <option value="CAD$">CAD</option>
          </select>
        </div>
      </div>
    </div>

    <!-- LINE ITEMS -->
    <div class="field-group">
      <div class="field-group-title">Line Items</div>
      <div class="line-header">
        <span>Description</span><span>Qty</span><span>Rate</span><span></span>
      </div>
      <div class="line-items" id="line-items"></div>
      <button class="btn" onclick="addLine()">+ Add Line</button>
    </div>

    <!-- TAX -->
    <div class="field-group">
      <div class="field-group-title">Tax &amp; Notes</div>
      <div class="field-row">
        <div><label>Tax Rate (%)</label><input id="tax-rate" type="number" min="0" max="100" step="0.1" placeholder="0" oninput="render()" /></div>
        <div><label>Discount (%)</label><input id="discount" type="number" min="0" max="100" step="0.1" placeholder="0" oninput="render()" /></div>
      </div>
      <div class="field-row full"><label>Notes / Payment Terms</label><textarea id="inv-notes" placeholder="Payment due within 30 days. Thank you for your business." oninput="render()"></textarea></div>
    </div>

    <div class="btn-row">
      <button class="btn primary" onclick="printInvoice()">&#8595; Download PDF</button>
      <button class="btn" onclick="saveForm()">&#128190; Save Draft</button>
      <button class="btn" onclick="clearForm()">Clear</button>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="preview-pane">
    <div class="preview-label">Live Preview</div>
    <div id="invoice-sheet"></div>
  </div>

</div>

<div id="toast"></div>

<script>
  const SAVE_KEY = 'it_ch03_draft';
  let lines = [];

  function addLine(data) {
    const id = data?.id || Date.now().toString();
    const desc = data?.desc || '';
    const qty = data?.qty || '';
    const rate = data?.rate || '';
    lines.push({ id, desc, qty, rate });

    const container = document.getElementById('line-items');
    const row = document.createElement('div');
    row.className = 'line-item';
    row.id = 'line-' + id;
    row.innerHTML = `
      <input type="text" placeholder="Service description" value="${desc}"
        oninput="updateLine('${id}','desc',this.value)" />
      <input type="number" placeholder="1" min="0" step="0.5" value="${qty}"
        oninput="updateLine('${id}','qty',this.value)" />
      <input type="number" placeholder="0.00" min="0" step="0.01" value="${rate}"
        oninput="updateLine('${id}','rate',this.value)" />
      <button class="line-delete" onclick="removeLine('${id}')" title="Remove">&times;</button>`;
    container.appendChild(row);
    render();
  }

  function updateLine(id, field, value) {
    const l = lines.find(l => l.id === id);
    if (l) { l[field] = value; render(); }
  }

  function removeLine(id) {
    document.getElementById('line-' + id)?.remove();
    lines = lines.filter(l => l.id !== id);
    render();
  }

  function g(id) { return document.getElementById(id)?.value?.trim() || ''; }

  function fmt(n, sym) {
    return sym + parseFloat(n || 0).toFixed(2);
  }

  function render() {
    const sym = g('inv-currency') || '$';
    const subtotal = lines.reduce((sum, l) => {
      return sum + (parseFloat(l.qty || 0) * parseFloat(l.rate || 0));
    }, 0);
    const discPct = parseFloat(g('discount') || 0);
    const taxPct  = parseFloat(g('tax-rate') || 0);
    const discAmt = subtotal * (discPct / 100);
    const taxable = subtotal - discAmt;
    const taxAmt  = taxable * (taxPct / 100);
    const total   = taxable + taxAmt;

    const dateVal = g('inv-date');
    const dueVal  = g('inv-due');
    const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '—';

    const rowsHTML = lines.length
      ? lines.map(l => {
          const amt = (parseFloat(l.qty||0) * parseFloat(l.rate||0));
          return `<tr>
            <td>${l.desc || '<em style="color:#aaa">No description</em>'}</td>
            <td>${l.qty || 0}</td>
            <td>${fmt(l.rate, sym)}</td>
            <td>${fmt(amt, sym)}</td>
          </tr>`;
        }).join('')
      : `<tr><td colspan="4" style="color:#aaa;text-align:center;padding:1rem 0;">No line items yet</td></tr>`;

    const totalsHTML = `
      <div class="inv-total-row"><span>Subtotal</span><span>${fmt(subtotal, sym)}</span></div>
      ${discPct > 0 ? `<div class="inv-total-row"><span>Discount (${discPct}%)</span><span>&minus;${fmt(discAmt, sym)}</span></div>` : ''}
      ${taxPct  > 0 ? `<div class="inv-total-row"><span>Tax (${taxPct}%)</span><span>${fmt(taxAmt, sym)}</span></div>` : ''}
      <div class="inv-total-row grand"><span>Total Due</span><span>${fmt(total, sym)}</span></div>`;

    const fromName = g('from-name') || 'Your Name';
    const brandParts = fromName.split(' ');
    const brandHTML = brandParts.length > 1
      ? brandParts.slice(0,-1).join(' ') + ' <span>' + brandParts.slice(-1)[0] + '</span>'
      : '<span>' + fromName + '</span>';

    document.getElementById('invoice-sheet').innerHTML = `
      <div class="inv-header">
        <div class="inv-brand">${brandHTML}</div>
        <div class="inv-meta">
          <div class="inv-number">${g('inv-number') || 'INV-001'}</div>
          <div class="inv-date">Issued: ${fmtDate(dateVal)}</div>
          ${dueVal ? `<div class="inv-date">Due: ${fmtDate(dueVal)}</div>` : ''}
        </div>
      </div>
      <div class="inv-parties">
        <div>
          <div class="inv-party-label">From</div>
          <div class="inv-party-name">${g('from-name') || 'Your Name'}</div>
          <div class="inv-party-detail">${g('from-email')}${g('from-email') && g('from-address') ? '\n' : ''}${g('from-address')}</div>
        </div>
        <div>
          <div class="inv-party-label">Bill To</div>
          <div class="inv-party-name">${g('to-name') || 'Client Name'}</div>
          <div class="inv-party-detail">${g('to-email')}${g('to-email') && g('to-address') ? '\n' : ''}${g('to-address')}</div>
        </div>
      </div>
      <table class="inv-table">
        <thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
        <tbody>${rowsHTML}</tbody>
      </table>
      <div class="inv-totals">${totalsHTML}</div>
      ${g('inv-notes') ? `<div class="inv-notes"><div class="inv-notes-label">Notes</div>${g('inv-notes')}</div>` : ''}
    `;
  }

  function printInvoice() {
    const sheet = document.getElementById('invoice-sheet').cloneNode(true);
    const win = window.open('', '_blank');
    win.document.write(`<!DOCTYPE html><html><head><title>Invoice</title><style>
      body{margin:0;padding:2rem;font-family:'Segoe UI',Arial,sans-serif;background:white;color:#111;}
      .inv-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;border-bottom:3px solid #e00;padding-bottom:1.5rem;}
      .inv-brand{font-size:1.4rem;font-weight:bold;text-transform:uppercase;letter-spacing:.06em;}
      .inv-brand span{color:#e00;}
      .inv-meta{text-align:right;}
      .inv-number{font-size:1rem;font-weight:bold;}
      .inv-date{font-size:.8rem;color:#888;margin-top:.2rem;}
      .inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-bottom:2rem;}
      .inv-party-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#aaa;margin-bottom:.4rem;}
      .inv-party-name{font-weight:bold;font-size:.95rem;}
      .inv-party-detail{font-size:.82rem;color:#555;line-height:1.6;white-space:pre-line;}
      .inv-table{width:100%;border-collapse:collapse;margin-bottom:1.5rem;}
      .inv-table th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#aaa;border-bottom:1px solid #ddd;padding:.5rem .4rem;text-align:left;}
      .inv-table th:last-child,.inv-table td:last-child{text-align:right;}
      .inv-table td{padding:.65rem .4rem;border-bottom:1px solid #f0f0f0;font-size:.88rem;color:#222;}
      .inv-totals{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;margin-bottom:2rem;}
      .inv-total-row{display:flex;gap:2rem;font-size:.88rem;color:#555;}
      .inv-total-row.grand{font-size:1.05rem;font-weight:bold;color:#111;border-top:2px solid #e00;padding-top:.4rem;margin-top:.2rem;}
      .inv-total-row span:last-child{min-width:90px;text-align:right;}
      .inv-notes{font-size:.82rem;color:#666;border-top:1px solid #eee;padding-top:1rem;white-space:pre-line;}
      .inv-notes-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#bbb;margin-bottom:.3rem;}
    </style></head><body>${sheet.outerHTML}</body></html>`);
    win.document.close();
    setTimeout(() => { win.focus(); win.print(); }, 400);
  }

  function saveForm() {
    const data = {
      fromName: g('from-name'), fromEmail: g('from-email'), fromAddress: g('from-address'),
      toName: g('to-name'), toEmail: g('to-email'), toAddress: g('to-address'),
      invNumber: g('inv-number'), invDate: g('inv-date'), invDue: g('inv-due'),
      currency: g('inv-currency'), taxRate: g('tax-rate'), discount: g('discount'),
      notes: g('inv-notes'), lines
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    showToast('\u2705 Draft saved');
  }

  function loadForm() {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { loadDefaults(); return; }
    try {
      const d = JSON.parse(raw);
      document.getElementById('from-name').value    = d.fromName    || '';
      document.getElementById('from-email').value   = d.fromEmail   || '';
      document.getElementById('from-address').value = d.fromAddress || '';
      document.getElementById('to-name').value      = d.toName      || '';
      document.getElementById('to-email').value     = d.toEmail     || '';
      document.getElementById('to-address').value   = d.toAddress   || '';
      document.getElementById('inv-number').value   = d.invNumber   || '';
      document.getElementById('inv-date').value     = d.invDate     || '';
      document.getElementById('inv-due').value      = d.invDue      || '';
      document.getElementById('inv-currency').value = d.currency    || '$';
      document.getElementById('tax-rate').value     = d.taxRate     || '';
      document.getElementById('discount').value     = d.discount    || '';
      document.getElementById('inv-notes').value    = d.notes       || '';
      (d.lines || []).forEach(l => addLine(l));
      render();
    } catch(e) { loadDefaults(); }
  }

  function loadDefaults() {
    document.getElementById('from-name').value    = 'Internationally Tribal';
    document.getElementById('from-email').value   = 'hello@internationallytribal.com';
    document.getElementById('from-address').value = 'Portland, ME 04101';
    document.getElementById('inv-number').value   = 'INV-001';
    document.getElementById('inv-notes').value    = 'Payment due within 30 days.\nThank you for your business.';
    const today = new Date().toISOString().split('T')[0];
    const due   = new Date(Date.now() + 30*864e5).toISOString().split('T')[0];
    document.getElementById('inv-date').value = today;
    document.getElementById('inv-due').value  = due;
    addLine({ id: 'l1', desc: 'Brand Strategy Session',    qty: '1',   rate: '350.00' });
    addLine({ id: 'l2', desc: 'Social Content Package (4 posts)', qty: '1', rate: '200.00' });
    addLine({ id: 'l3', desc: 'Logo Animation (Chapter 00 style)', qty: '2', rate: '150.00' });
    render();
  }

  function clearForm() {
    if (!confirm('Clear all invoice data?')) return;
    document.querySelectorAll('input, textarea').forEach(el => el.value = '');
    document.getElementById('inv-currency').value = '$';
    document.getElementById('line-items').innerHTML = '';
    lines = [];
    localStorage.removeItem(SAVE_KEY);
    render();
    showToast('Board cleared');
  }

  function showToast(msg, dur = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), dur);
  }

  loadForm();
</script>

</body>
</html>
