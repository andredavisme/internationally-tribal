<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter 01 — Daily Focus Dashboard</title>
  <style>
    :root {
      --black: #111;
      --red: #e00;
      --white: #f5f5f5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.5rem;
      border-bottom: 2px solid #1e1e1e;
      background: #111;
      z-index: 10;
    }
    nav a {
      color: var(--red);
      text-decoration: none;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    nav span { color: #444; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }

    .dashboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      max-width: 560px;
      margin-top: 3.5rem;
    }

    /* Clock */
    #clock {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 200;
      letter-spacing: 0.04em;
      color: var(--white);
      line-height: 1;
    }
    #date {
      font-size: 1rem;
      color: #555;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: -1rem;
    }

    /* Intention */
    .intention-wrap {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 1.5rem;
    }
    .section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--red);
      margin-bottom: 0.75rem;
    }
    #intention-display {
      font-size: 1.25rem;
      color: var(--white);
      min-height: 2rem;
      cursor: pointer;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 0.5rem;
      transition: border-color 0.2s;
    }
    #intention-display:hover { border-color: var(--red); }
    #intention-display.placeholder { color: #444; font-style: italic; }
    #intention-input {
      display: none;
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--red);
      color: var(--white);
      font-size: 1.25rem;
      font-family: inherit;
      outline: none;
      padding-bottom: 0.5rem;
    }
    .intention-hint { font-size: 0.78rem; color: #444; margin-top: 0.5rem; }

    /* Focus Timer */
    .timer-wrap {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
    }
    #timer-display {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 200;
      letter-spacing: 0.06em;
      color: var(--white);
      margin: 0.5rem 0 1rem;
    }
    #timer-display.running { color: var(--red); }
    .timer-controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      font-family: inherit;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0.5rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn:hover, .btn.active { border-color: var(--red); color: var(--white); }
    .btn.primary { border-color: var(--red); color: var(--red); }
    .btn.primary:hover { background: var(--red); color: white; }
    .preset-row { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 0.75rem; }
    .preset-row .btn { font-size: 0.75rem; padding: 0.3rem 0.75rem; }

    /* Sessions */
    .sessions-wrap {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 1.5rem;
    }
    #session-log { list-style: none; margin-top: 0.5rem; }
    #session-log li {
      font-size: 0.85rem;
      color: #666;
      padding: 0.3rem 0;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      justify-content: space-between;
    }
    #session-log li span { color: var(--red); }
    .no-sessions { color: #333; font-style: italic; font-size: 0.85rem; }

    footer-nav {
      display: block;
      text-align: center;
      margin-top: 1rem;
      font-size: 0.78rem;
      color: #444;
    }
    footer-nav a { color: var(--red); text-decoration: none; }
  </style>
</head>
<body>

<nav>
  <a href="../../hub.html">&larr; All Chapters</a>
  <span>Chapter 01 &mdash; Daily Focus Dashboard</span>
  <a href="../../activity.html">Activity Guide</a>
</nav>

<div class="dashboard">

  <div>
    <div id="clock">00:00:00</div>
    <div id="date">Loading...</div>
  </div>

  <div class="intention-wrap">
    <div class="section-label">Today's Intention</div>
    <div id="intention-display" class="placeholder" title="Click to edit">Click to set your intention for today...</div>
    <input id="intention-input" type="text" maxlength="120" placeholder="What matters most today?" />
    <div class="intention-hint">Saved automatically &mdash; persists until you change it.</div>
  </div>

  <div class="timer-wrap">
    <div class="section-label">Focus Timer</div>
    <div class="preset-row">
      <button class="btn" onclick="setPreset(25)">25 min</button>
      <button class="btn" onclick="setPreset(45)">45 min</button>
      <button class="btn" onclick="setPreset(60)">60 min</button>
      <button class="btn" onclick="setPreset(5)">5 min break</button>
    </div>
    <div id="timer-display">25:00</div>
    <div class="timer-controls">
      <button class="btn primary" id="start-btn" onclick="toggleTimer()">Start</button>
      <button class="btn" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <div class="sessions-wrap">
    <div class="section-label">Today's Sessions</div>
    <ul id="session-log"><li class="no-sessions">No sessions completed yet.</li></ul>
  </div>

</div>

<script>
  // ── CLOCK ──
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-US', { hour12: false });
    document.getElementById('date').textContent =
      now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }).toUpperCase();
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── INTENTION ──
  const display = document.getElementById('intention-display');
  const input   = document.getElementById('intention-input');
  const KEY     = 'it_intention';

  function loadIntention() {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      display.textContent = saved;
      display.classList.remove('placeholder');
    }
  }
  loadIntention();

  display.addEventListener('click', () => {
    display.style.display = 'none';
    input.style.display = 'block';
    input.value = display.classList.contains('placeholder') ? '' : display.textContent;
    input.focus();
  });

  function saveIntention() {
    const val = input.value.trim();
    input.style.display = 'none';
    display.style.display = 'block';
    if (val) {
      display.textContent = val;
      display.classList.remove('placeholder');
      localStorage.setItem(KEY, val);
    } else {
      display.textContent = 'Click to set your intention for today...';
      display.classList.add('placeholder');
      localStorage.removeItem(KEY);
    }
  }
  input.addEventListener('blur', saveIntention);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') saveIntention(); });

  // ── TIMER ──
  let totalSeconds = 25 * 60;
  let remaining   = totalSeconds;
  let running     = false;
  let interval    = null;
  let sessions    = JSON.parse(localStorage.getItem('it_sessions') || '[]');

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  function renderTimer() {
    const el = document.getElementById('timer-display');
    el.textContent = formatTime(remaining);
    el.classList.toggle('running', running);
  }
  renderTimer();

  function setPreset(mins) {
    clearInterval(interval);
    running = false;
    document.getElementById('start-btn').textContent = 'Start';
    totalSeconds = mins * 60;
    remaining = totalSeconds;
    renderTimer();
  }

  function toggleTimer() {
    const btn = document.getElementById('start-btn');
    if (running) {
      clearInterval(interval);
      running = false;
      btn.textContent = 'Resume';
    } else {
      running = true;
      btn.textContent = 'Pause';
      interval = setInterval(() => {
        remaining--;
        renderTimer();
        if (remaining <= 0) {
          clearInterval(interval);
          running = false;
          btn.textContent = 'Start';
          logSession();
        }
      }, 1000);
    }
    renderTimer();
  }

  function resetTimer() {
    clearInterval(interval);
    running = false;
    remaining = totalSeconds;
    document.getElementById('start-btn').textContent = 'Start';
    renderTimer();
  }

  function logSession() {
    const mins = Math.round(totalSeconds / 60);
    const now  = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const entry = { time: now, duration: mins, intention: localStorage.getItem(KEY) || 'No intention set' };
    sessions.unshift(entry);
    if (sessions.length > 10) sessions = sessions.slice(0, 10);
    // Only keep today's sessions
    localStorage.setItem('it_sessions', JSON.stringify(sessions));
    renderSessions();
  }

  function renderSessions() {
    const ul = document.getElementById('session-log');
    if (!sessions.length) {
      ul.innerHTML = '<li class="no-sessions">No sessions completed yet.</li>';
      return;
    }
    ul.innerHTML = sessions.map(s =>
      `<li>${s.time} &mdash; ${s.intention} <span>${s.duration} min</span></li>`
    ).join('');
  }
  renderSessions();
</script>

</body>
</html>
