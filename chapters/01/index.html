<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter 01 — Daily Focus Dashboard</title>
  <style>
    :root {
      --black: #111;
      --red: #e00;
      --white: #f5f5f5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.5rem;
      border-bottom: 2px solid #1e1e1e;
      background: #111;
      z-index: 10;
    }
    nav a {
      color: var(--red);
      text-decoration: none;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    nav span { color: #444; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }

    .dashboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      max-width: 560px;
      margin-top: 4rem;
      padding-bottom: 3rem;
    }

    /* ── CLOCK BLOCK ── */
    .clock-block {
      text-align: center;
      width: 100%;
    }
    .clock-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 0.4rem;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 0.2rem 0.6rem;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
    }
    .live-dot {
      width: 6px; height: 6px;
      background: var(--red);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    #clock {
      font-size: clamp(3.2rem, 13vw, 6.5rem);
      font-weight: 200;
      letter-spacing: 0.04em;
      color: var(--white);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    #date {
      font-size: 0.82rem;
      color: #444;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    /* ── INTENTION ── */
    .intention-wrap {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 1.5rem;
      position: relative;
    }
    .section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--red);
      margin-bottom: 0.75rem;
    }
    .section-sublabel {
      font-size: 0.7rem;
      color: #3a3a3a;
      margin-bottom: 0.75rem;
      margin-top: -0.5rem;
    }
    #intention-display {
      font-size: 1.2rem;
      color: var(--white);
      min-height: 2rem;
      cursor: pointer;
      padding: 0.5rem 0.5rem 0.5rem 0;
      border-bottom: 1px solid #2a2a2a;
      transition: border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #intention-display::after {
      content: '✎';
      font-size: 0.75rem;
      color: #333;
      margin-left: auto;
      transition: color 0.2s;
    }
    #intention-display:hover { border-color: var(--red); }
    #intention-display:hover::after { color: var(--red); }
    #intention-display.placeholder { color: #3a3a3a; font-style: italic; }
    #intention-input {
      display: none;
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--red);
      color: var(--white);
      font-size: 1.2rem;
      font-family: inherit;
      outline: none;
      padding: 0.4rem 0;
    }
    .intention-actions {
      display: none;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .intention-actions.visible { display: flex; }
    .intention-note {
      font-size: 0.75rem;
      color: #3a3a3a;
      margin-top: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .intention-note.saved { color: #4a9; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e1e1e;
      border: 1px solid #333;
      border-left: 3px solid var(--red);
      color: #ccc;
      font-size: 0.82rem;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── TIMER ── */
    .timer-wrap {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
    }
    #timer-display {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 200;
      letter-spacing: 0.06em;
      color: var(--white);
      margin: 0.5rem 0 1rem;
      font-variant-numeric: tabular-nums;
    }
    #timer-display.running { color: var(--red); }
    .timer-controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      font-family: inherit;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0.5rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .btn:hover { border-color: var(--red); color: var(--white); }
    .btn.primary { border-color: var(--red); color: var(--red); }
    .btn.primary:hover { background: var(--red); color: white; }
    .btn.small { font-size: 0.72rem; padding: 0.25rem 0.65rem; }
    .preset-row { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 0.75rem; flex-wrap: wrap; }

    /* ── SESSIONS ── */
    .sessions-wrap {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 1.5rem;
    }
    #session-log { list-style: none; margin-top: 0.5rem; }
    #session-log li {
      font-size: 0.85rem;
      color: #666;
      padding: 0.4rem 0;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }
    #session-log li .s-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #session-log li .s-meta { color: var(--red); white-space: nowrap; font-size: 0.8rem; }
    .no-sessions { color: #2e2e2e; font-style: italic; font-size: 0.85rem; }
  </style>
</head>
<body>

<nav>
  <a href="../../hub.html">&larr; All Chapters</a>
  <span>Ch 01 — Daily Focus Dashboard</span>
  <a href="../../activity.html">Activity Guide</a>
</nav>

<div id="toast"></div>

<div class="dashboard">

  <!-- CLOCK -->
  <div class="clock-block">
    <div class="clock-meta">
      <span class="live-badge"><span class="live-dot"></span> Live Time</span>
    </div>
    <div id="clock">00:00:00</div>
    <div id="date">Loading...</div>
  </div>

  <!-- INTENTION -->
  <div class="intention-wrap">
    <div class="section-label">Today's Intention</div>
    <div class="section-sublabel">Saved to your browser &mdash; stays here until you change it</div>
    <div id="intention-display" class="placeholder" title="Click to edit">What matters most today?</div>
    <input id="intention-input" type="text" maxlength="120" placeholder="Type your intention and press Enter" />
    <div class="intention-actions" id="intention-actions">
      <button class="btn small primary" onclick="saveIntention()">Save &amp; Close</button>
      <button class="btn small" onclick="cancelIntention()">Cancel</button>
    </div>
    <div class="intention-note" id="intention-note">&#128190; Not yet saved for today</div>
  </div>

  <!-- TIMER -->
  <div class="timer-wrap">
    <div class="section-label">Focus Timer</div>
    <div class="preset-row">
      <button class="btn small" onclick="setPreset(25)">25 min</button>
      <button class="btn small" onclick="setPreset(45)">45 min</button>
      <button class="btn small" onclick="setPreset(60)">60 min</button>
      <button class="btn small" onclick="setPreset(5)">5 min break</button>
    </div>
    <div id="timer-display">25:00</div>
    <div class="timer-controls">
      <button class="btn primary" id="start-btn" onclick="toggleTimer()">Start</button>
      <button class="btn" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <!-- SESSIONS -->
  <div class="sessions-wrap">
    <div class="section-label">Today's Sessions</div>
    <ul id="session-log"><li class="no-sessions">Complete a timer session to log it here.</li></ul>
  </div>

</div>

<script>
  // ─ CLOCK
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-US', { hour12: false });
    document.getElementById('date').textContent =
      now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }).toUpperCase();
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ─ TOAST
  function showToast(msg, duration = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  // ─ INTENTION
  const display  = document.getElementById('intention-display');
  const input    = document.getElementById('intention-input');
  const actions  = document.getElementById('intention-actions');
  const note     = document.getElementById('intention-note');
  const KEY      = 'it_intention';
  let   editing  = false;
  let   original = '';

  function loadIntention() {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      display.textContent = saved;
      display.classList.remove('placeholder');
      note.textContent = '\u2705 Saved to this browser';
      note.classList.add('saved');
    }
  }
  loadIntention();

  display.addEventListener('click', openIntention);

  function openIntention() {
    if (editing) return;
    editing = true;
    original = display.classList.contains('placeholder') ? '' : display.textContent;
    display.style.display = 'none';
    input.style.display = 'block';
    input.value = original;
    actions.classList.add('visible');
    note.textContent = '\u23ce Press Enter or click Save to confirm';
    note.classList.remove('saved');
    input.focus();
  }

  function saveIntention() {
    const val = input.value.trim();
    closeEditor();
    if (val) {
      display.textContent = val;
      display.classList.remove('placeholder');
      localStorage.setItem(KEY, val);
      note.textContent = '\u2705 Saved to this browser';
      note.classList.add('saved');
      showToast('\u2705 Intention saved');
    } else {
      display.textContent = 'What matters most today?';
      display.classList.add('placeholder');
      localStorage.removeItem(KEY);
      note.textContent = '\u128190 Not yet saved for today';
      note.classList.remove('saved');
    }
  }

  function cancelIntention() {
    input.value = original;
    closeEditor();
    const saved = localStorage.getItem(KEY);
    if (saved) {
      note.textContent = '\u2705 Saved to this browser';
      note.classList.add('saved');
    } else {
      note.textContent = '\u128190 Not yet saved for today';
      note.classList.remove('saved');
    }
  }

  function closeEditor() {
    editing = false;
    input.style.display = 'none';
    display.style.display = '';
    actions.classList.remove('visible');
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') saveIntention();
    if (e.key === 'Escape') cancelIntention();
  });

  // ─ TIMER
  let totalSeconds = 25 * 60;
  let remaining    = totalSeconds;
  let running      = false;
  let interval     = null;
  let sessions     = JSON.parse(localStorage.getItem('it_sessions') || '[]');

  function formatTime(s) {
    return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
  }

  function renderTimer() {
    const el = document.getElementById('timer-display');
    el.textContent = formatTime(remaining);
    el.classList.toggle('running', running);
  }
  renderTimer();

  function setPreset(mins) {
    clearInterval(interval);
    running = false;
    document.getElementById('start-btn').textContent = 'Start';
    totalSeconds = mins * 60;
    remaining = totalSeconds;
    renderTimer();
  }

  function toggleTimer() {
    const btn = document.getElementById('start-btn');
    if (running) {
      clearInterval(interval);
      running = false;
      btn.textContent = 'Resume';
    } else {
      running = true;
      btn.textContent = 'Pause';
      interval = setInterval(() => {
        remaining--;
        renderTimer();
        if (remaining <= 0) {
          clearInterval(interval);
          running = false;
          btn.textContent = 'Start';
          logSession();
          showToast('\u23f1 Session complete!');
        }
      }, 1000);
    }
    renderTimer();
  }

  function resetTimer() {
    clearInterval(interval);
    running = false;
    remaining = totalSeconds;
    document.getElementById('start-btn').textContent = 'Start';
    renderTimer();
  }

  function logSession() {
    const mins = Math.round(totalSeconds / 60);
    const now  = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    sessions.unshift({ time: now, duration: mins, intention: localStorage.getItem(KEY) || 'No intention set' });
    if (sessions.length > 10) sessions = sessions.slice(0, 10);
    localStorage.setItem('it_sessions', JSON.stringify(sessions));
    renderSessions();
  }

  function renderSessions() {
    const ul = document.getElementById('session-log');
    if (!sessions.length) {
      ul.innerHTML = '<li class="no-sessions">Complete a timer session to log it here.</li>';
      return;
    }
    ul.innerHTML = sessions.map(s =>
      `<li><span class="s-label">${s.intention}</span><span class="s-meta">${s.time} &middot; ${s.duration}m</span></li>`
    ).join('');
  }
  renderSessions();
</script>

</body>
</html>
