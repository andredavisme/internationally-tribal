<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter 02 — Idea Capture Board</title>
  <style>
    :root {
      --black: #111;
      --red: #e00;
      --white: #f5f5f5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      position: relative;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.5rem;
      border-bottom: 2px solid #1e1e1e;
      background: #111;
      flex-shrink: 0;
    }
    nav a {
      color: var(--red);
      text-decoration: none;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    nav span { color: #444; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 1.5rem;
      background: #141414;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .toolbar-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
      margin-right: 0.25rem;
    }
    .btn {
      background: transparent;
      border: 1px solid #333;
      color: #999;
      font-family: inherit;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .btn:hover { border-color: var(--red); color: var(--white); }
    .btn.primary { border-color: var(--red); color: var(--red); }
    .btn.primary:hover { background: var(--red); color: white; }
    .color-swatch {
      width: 22px; height: 22px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.15s;
      flex-shrink: 0;
    }
    .color-swatch:hover, .color-swatch.active { border-color: var(--white); transform: scale(1.15); }
    .divider { width: 1px; height: 22px; background: #2a2a2a; margin: 0 0.25rem; }
    #note-count {
      margin-left: auto;
      font-size: 0.75rem;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── CANVAS ── */
    #canvas {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: default;
    }
    #canvas.drag-over { background: #131313; }

    /* ── NOTES ── */
    .note {
      position: absolute;
      min-width: 180px;
      max-width: 280px;
      border-radius: 6px;
      padding: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      cursor: grab;
      user-select: none;
      transition: box-shadow 0.15s;
      z-index: 1;
    }
    .note:hover { box-shadow: 0 6px 28px rgba(0,0,0,0.7); z-index: 10; }
    .note.dragging { cursor: grabbing; opacity: 0.92; z-index: 999; box-shadow: 0 12px 40px rgba(0,0,0,0.8); }
    .note-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.6rem 0.45rem 0.75rem;
      border-radius: 6px 6px 0 0;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.6);
      font-weight: 600;
      cursor: grab;
    }
    .note.dragging .note-header { cursor: grabbing; }
    .note-delete {
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
      padding: 0 0.15rem;
      transition: color 0.15s;
    }
    .note-delete:hover { color: rgba(255,255,255,0.9); }
    .note-body {
      background: #1a1a1a;
      border-radius: 0 0 6px 6px;
      padding: 0.85rem 0.85rem;
      min-height: 72px;
    }
    .note-text {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--white);
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.55;
      resize: none;
      outline: none;
      cursor: text;
      min-height: 56px;
    }
    .note-text::placeholder { color: #333; }
    .note-tag {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.5rem;
      cursor: text;
      outline: none;
    }
    .note-tag:empty::before { content: 'Add tag...'; color: #2a2a2a; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e1e1e;
      border: 1px solid #333;
      border-left: 3px solid var(--red);
      color: #ccc;
      font-size: 0.82rem;
      padding: 0.55rem 1.2rem;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 9999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── EMPTY STATE ── */
    #empty-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #empty-hint .hint-icon { font-size: 2.5rem; opacity: 0.08; margin-bottom: 0.75rem; }
    #empty-hint p { color: #2a2a2a; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; }
  </style>
</head>
<body>

<nav>
  <a href="../../hub.html">&larr; All Chapters</a>
  <span>Ch 02 — Idea Capture Board</span>
  <a href="activity.html">&#128218; Activity Guide</a>
</nav>

<div class="toolbar">
  <span class="toolbar-label">New Note</span>
  <div class="color-swatch active" style="background:#e00;" data-color="#e00" title="Red" onclick="selectColor(this)"></div>
  <div class="color-swatch" style="background:#1a1a1a; border-color:#333;" data-color="#1a1a1a" title="Dark" onclick="selectColor(this)"></div>
  <div class="color-swatch" style="background:#1a2e1a;" data-color="#1a2e1a" title="Green" onclick="selectColor(this)"></div>
  <div class="color-swatch" style="background:#1a1a2e;" data-color="#1a1a2e" title="Blue" onclick="selectColor(this)"></div>
  <div class="color-swatch" style="background:#2e1a2e;" data-color="#2e1a2e" title="Purple" onclick="selectColor(this)"></div>
  <button class="btn primary" onclick="addNote()">+ Add Note</button>
  <div class="divider"></div>
  <button class="btn" onclick="clearAll()">Clear All</button>
  <span id="note-count">0 notes</span>
</div>

<div id="canvas">
  <div id="empty-hint">
    <div class="hint-icon">&#9998;</div>
    <p>Click &ldquo;+ Add Note&rdquo; to begin</p>
  </div>
</div>

<div id="toast"></div>

<script>
  const STORAGE_KEY = 'it_ch02_notes';
  let notes = [];
  let selectedColor = '#e00';
  let dragState = null;

  // Color labels for note headers
  const COLOR_LABELS = {
    '#e00': 'Idea',
    '#1a1a1a': 'Note',
    '#1a2e1a': 'Action',
    '#1a1a2e': 'Research',
    '#2e1a2e': 'Question'
  };

  function selectColor(el) {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    selectedColor = el.dataset.color;
  }

  function addNote(data) {
    const canvas = document.getElementById('canvas');
    const cx = canvas.offsetWidth;
    const cy = canvas.offsetHeight;

    const id = data?.id || Date.now().toString();
    const color = data?.color || selectedColor;
    const text = data?.text || '';
    const tag = data?.tag || '';
    const x = data?.x ?? (60 + Math.random() * Math.max(0, cx - 320));
    const y = data?.y ?? (40 + Math.random() * Math.max(0, cy - 200));

    const noteData = { id, color, text, tag, x, y };
    if (!data) {
      notes.push(noteData);
      save();
    }

    const el = document.createElement('div');
    el.className = 'note';
    el.id = 'note-' + id;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = `
      <div class="note-header" style="background:${color};">
        <span>${COLOR_LABELS[color] || 'Note'}</span>
        <button class="note-delete" onclick="deleteNote('${id}')" title="Delete">&#215;</button>
      </div>
      <div class="note-body">
        <textarea class="note-text" placeholder="Type your idea..." onInput="updateNote('${id}', 'text', this.value)" rows="3">${text}</textarea>
        <div class="note-tag" contenteditable="true" spellcheck="false" data-id="${id}" onInput="updateNote('${id}', 'tag', this.textContent)">${tag}</div>
      </div>`;

    makeDraggable(el, id);
    canvas.appendChild(el);
    updateHint();
    updateCount();

    if (!data) {
      const ta = el.querySelector('.note-text');
      ta.focus();
    }
  }

  function updateNote(id, field, value) {
    const n = notes.find(n => n.id === id);
    if (n) { n[field] = value; save(); }
  }

  function deleteNote(id) {
    const el = document.getElementById('note-' + id);
    if (el) el.remove();
    notes = notes.filter(n => n.id !== id);
    save();
    updateHint();
    updateCount();
    showToast('Note removed');
  }

  function clearAll() {
    if (!notes.length) return;
    if (!confirm('Clear all notes from the board?')) return;
    document.querySelectorAll('.note').forEach(el => el.remove());
    notes = [];
    save();
    updateHint();
    updateCount();
    showToast('Board cleared');
  }

  function makeDraggable(el, id) {
    const header = el.querySelector('.note-header');
    header.addEventListener('mousedown', e => {
      if (e.target.classList.contains('note-delete')) return;
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const canvasRect = document.getElementById('canvas').getBoundingClientRect();
      dragState = {
        el, id,
        offX: e.clientX - rect.left,
        offY: e.clientY - rect.top,
        canvasRect
      };
      el.classList.add('dragging');
    });
  }

  document.addEventListener('mousemove', e => {
    if (!dragState) return;
    const { el, offX, offY, canvasRect } = dragState;
    const x = e.clientX - canvasRect.left - offX;
    const y = e.clientY - canvasRect.top - offY;
    el.style.left = Math.max(0, x) + 'px';
    el.style.top = Math.max(0, y) + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragState) return;
    const { el, id } = dragState;
    el.classList.remove('dragging');
    const n = notes.find(n => n.id === id);
    if (n) {
      n.x = parseFloat(el.style.left);
      n.y = parseFloat(el.style.top);
      save();
    }
    dragState = null;
  });

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }

  function load() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        notes = JSON.parse(raw);
        notes.forEach(n => addNote(n));
      } catch(e) { notes = []; }
    } else {
      loadDefaults();
    }
    updateHint();
    updateCount();
  }

  function loadDefaults() {
    const defaults = [
      { id: 'd1', color: '#e00',    text: 'Open the show with the AI tool breakdown segment',  tag: 'Segment Idea',   x: 60,  y: 60  },
      { id: 'd2', color: '#1a2e1a', text: 'Test the parts-spec matcher live on stream',         tag: 'Demo',          x: 320, y: 80  },
      { id: 'd3', color: '#1a1a2e', text: 'Research: What are other creators using AI for in 2026?', tag: 'Research',   x: 580, y: 55  },
      { id: 'd4', color: '#e00',    text: 'Graphic intro bumper — animate the IT logo in',      tag: 'Production',    x: 80,  y: 290 },
      { id: 'd5', color: '#2e1a2e', text: 'Ask the audience: Would you use a daily focus dashboard?', tag: 'Audience Q', x: 360, y: 300 },
      { id: 'd6', color: '#1a1a1a', text: 'Schedule drop date for Chapter 03 — Invoice Generator', tag: 'Admin',       x: 620, y: 280 }
    ];
    notes = defaults;
    defaults.forEach(n => addNote(n));
    save();
  }

  function updateHint() {
    document.getElementById('empty-hint').style.opacity = notes.length ? '0' : '1';
  }

  function updateCount() {
    const el = document.getElementById('note-count');
    el.textContent = notes.length === 1 ? '1 note' : notes.length + ' notes';
  }

  function showToast(msg, duration = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  load();
</script>

</body>
</html>
